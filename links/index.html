<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Link Shortener</title>
</head>
<body>
    <div id="redirecting" style="display: none;">
        <p>Redirecting to <span id="target-url">...</span></p>
    </div>

    <div id="error" style="display: none; color: red;">
        <p>Error: Short link <strong id="missing-key"></strong> not found.</p>
        <p><a href="./">Back to links</a></p>
    </div>

    <div id="list-view" style="display: none;">
        <h1>Short Links</h1>
        <ul id="links-list">
            <li>Loading...</li>
        </ul>
        <p>Use the local CLI command in your repository to add or delete links:</p>
        <pre>node links/manage.js add [key] [url]</pre>
    </div>

    <script>
        function getRedirectKey() {
            if (window.location.hash) {
                return window.location.hash.substring(1);
            }
            if (window.location.search) {
                const search = window.location.search;
                if (search.includes('=')) {
                    const params = new URLSearchParams(search);
                    if (params.has('id')) return params.get('id');
                }
                return search.substring(1);
            }
            return null;
        }

        async function init() {
            const key = getRedirectKey();
            try {
                const response = await fetch('redirects.json');
                if (!response.ok) throw new Error('Could not load redirects.json');
                const redirects = await response.json();

                if (key) {
                    if (redirects.hasOwnProperty(key)) {
                        document.getElementById('redirecting').style.display = 'block';
                        document.getElementById('target-url').textContent = redirects[key];
                        window.location.replace(redirects[key]);
                    } else {
                        document.getElementById('error').style.display = 'block';
                        document.getElementById('missing-key').textContent = key;
                    }
                } else {
                    showList(redirects);
                }
            } catch (err) {
                console.error(err);
                alert('Error: ' + err.message);
            }
        }

        function showList(redirects) {
            document.getElementById('list-view').style.display = 'block';
            const listEl = document.getElementById('links-list');
            listEl.innerHTML = '';

            const keys = Object.keys(redirects);
            if (keys.length === 0) {
                listEl.innerHTML = '<li>No links configured yet.</li>';
                return;
            }

            const basePath = window.location.pathname.substring(0, window.location.pathname.indexOf('/links/'));
            const shortBaseUrl = window.location.origin + basePath + '/f/';

            keys.forEach(k => {
                const li = document.createElement('li');
                const shortUrl = shortBaseUrl + k;
                li.innerHTML = `<strong>${k}</strong> &rarr; <a href="${redirects[k]}" target="_blank">${redirects[k]}</a> (<a href="${shortUrl}">try redirect</a>)`;
                listEl.appendChild(li);
            });
        }

        init();
    </script>
</body>
</html>
